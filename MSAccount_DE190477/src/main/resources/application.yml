# [TODO-2.2, TODO-3.2: datasource DBAccount + naming strategy, cau hinh JWT]
server:
  port: 8081

spring:
  application:
    name: ms-account
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=DBAccount;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD:sa}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      # Giu NGUYEN ten trong @Table/@Column (StoreAccounts, WatchID...) dung nhu de bai.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true

jwt:
  secret: ${JWT_SECRET:mss301-watch-management-secret-key-2025-very-long-string}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${REFRESH_EXPIRATION:604800000}
