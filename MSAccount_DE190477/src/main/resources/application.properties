# [TODO-2.2, TODO-3.2: datasource DBAccount + naming strategy, cau hinh JWT]
server.port=8081
spring.application.name=ms-account

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=DBAccount;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:YourStrong@Password123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
# Giu NGUYEN ten trong @Table/@Column (StoreAccounts, WatchID...) dung nhu de bai.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:mss301-watch-management-secret-key-2025-very-long-string}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${REFRESH_EXPIRATION:604800000}